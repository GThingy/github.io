        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
            overflow: hidden;
        }

        /* Slide Transition Effects */
        .slide-container {
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Custom Scrollbar for Sidebar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0c10;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2833;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #45f3ff;
        }

        /* PDF Printing Optimizations - Exactly 1 slide per page */
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
                overflow: visible !important;
            }
            .no-print {
                display: none !important;
            }
            .print-slide {
                width: 100% !important;
                height: 100vh !important;
                page-break-after: always !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
                align-items: center !important;
                background: #0b0c10 !important; /* Keep original look for high quality prints */
                color: #ffffff !important;
                position: relative !important;
            }
            #app-container {
                display: block !important;
                height: auto !important;
            }
        }
    </style>

                document.getElementById('edit-bullets').value = currentSlide.desc;
            } else {
                document.getElementById('edit-bullets').value = '';
            }

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function saveSlideChanges() {
            const titleVal = document.getElementById('edit-title').value;
            const textVal = document.getElementById('edit-bullets').value;
            const targetSlide = slidesData[currentSlideIndex];

            targetSlide.title = titleVal;

            if (targetSlide.bullets) {
                targetSlide.bullets = textVal.split('\n').filter(line => line.trim() !== '');
            } else if (targetSlide.items) {
                targetSlide.items = textVal.split('\n').filter(line => line.trim() !== '');
            } else {
                targetSlide.desc = textVal;
            }

            // Sync visual updates instantly
            showSlide(currentSlideIndex);
            renderSlideList();
            closeEditModal();
        }
    </script>
</body>
</html>
